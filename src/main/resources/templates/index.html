<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explainable UI Generator</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <h1>Explainable UI Generator</h1>
            <p class="muted">Prompt → HTML/CSS → preview → explainability</p>
        </div>
    </header>

    <main class="panel">
        <form th:action="@{/generate}" th:object="${generationRequest}" method="post" class="form-card">
            <label for="prompt">Wpisz prompt</label>
            <textarea id="prompt" th:field="*{prompt}"  rows="8" placeholder="Np. dashboard for todo app with dark theme and login">Np. dashboard for todo app with dark theme and login</textarea>
            <p class="error" th:if="${#fields.hasErrors('prompt')}" th:errors="*{prompt}"></p>
            <button type="submit">Generate</button>
        </form>

        <section class="hint-card">
            <h2>Jak to działa</h2>
            <p>System dzieli prompt na fragmenty, generuje HTML/CSS i przypisuje wpływ fragmentów do elementów UI.</p>
        </section>
    </main>
</div>
</body>
</html>
